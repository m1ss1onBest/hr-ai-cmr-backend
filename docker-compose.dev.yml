services:
  postgres:
    image: postgres:17
    container_name: hrcrm_postgres
    restart: always
    environment:
      POSTGRES_USER: hrcrm
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hrcrm_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrcrm -d hrcrm_db']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: hrcrm
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 hrcrm password;
      mc mb local/resumes --ignore-existing;
      mc anonymous set public local/resumes;
      exit 0;
      "

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
